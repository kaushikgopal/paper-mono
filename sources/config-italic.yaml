# Oblique variant generated by scripts/make-italic.py. Regenerate the source
# before building: python3 scripts/make-italic.py
sources:
  - italic/PaperMono-Italic.designspace
familyName: "Paper Mono"
buildStatic: false
buildVariable: true
stat:
  PaperMono-Italic[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Thin
      value: 100
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Regular
      value: 400
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
  - name: Italic
    tag: ital
    values:
    - name: Italic
      value: 1
